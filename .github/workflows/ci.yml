name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Run tests
        run: uv run pytest --cov=microsuite --cov-report=term-missing --cov-report=xml

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run ty
        run: uv run ty check

      - name: Build package
        run: uv build

  nextflow-smoke:
    name: Nextflow smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "25.10.0"

      - name: Run amplicon_qiime2 workflow stub
        run: |
          nextflow run -stub-run workflows/nextflow/main.nf \
            -profile local \
            --manifest tests/fixtures/nextflow/manifest.tsv \
            --metadata tests/fixtures/nextflow/metadata.tsv \
            --classifier tests/fixtures/nextflow/classifier.qza \
            --outdir results/nextflow-smoke

      - name: Run amplicon_microsuite workflow stub
        run: |
          nextflow run -stub-run workflows/nextflow/main.nf \
            -profile local \
            --workflow amplicon_microsuite \
            --reads_fasta tests/fixtures/nextflow/reads.fasta \
            --metadata tests/fixtures/nextflow/metadata.tsv \
            --outdir results/nextflow-microsuite-smoke

  external-integration:
    name: External tool Python API integration
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
      MICROSUITE_RUN_EXTERNAL_INTEGRATION: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync --all-extras --locked

      - name: Install lightweight external tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fastp vsearch mafft fasttree
          uv pip install cutadapt multiqc

      - name: Run Python API external integration tests
        run: uv run pytest tests/integration/test_external_tools.py
