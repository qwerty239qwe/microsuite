name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build-heavy-containers:
        description: "Build heavy QIIME 2 and R differential-abundance images"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Run tests
        run: uv run pytest

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run ty
        run: uv run ty check

      - name: Build package
        run: uv build

  nextflow-smoke:
    name: Nextflow smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "25.10.0"

      - name: Run placeholder amplicon workflow
        run: |
          nextflow run workflows/nextflow/main.nf \
            -profile local \
            --manifest tests/fixtures/moving_pictures_small/table.tsv \
            --metadata tests/fixtures/moving_pictures_small/metadata.tsv \
            --classifier tests/fixtures/moving_pictures_small/taxonomy.tsv \
            --outdir results/nextflow-smoke

  docker-build:
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: microsuite
            dockerfile: containers/microsuite/Dockerfile
            context: .
            heavy: false
          - image: fastqc
            dockerfile: containers/fastqc/Dockerfile
            context: .
            heavy: false
          - image: kraken2
            dockerfile: containers/kraken2/Dockerfile
            context: .
            heavy: false
          - image: qiime2-amplicon
            dockerfile: containers/qiime2-amplicon/Dockerfile
            context: .
            heavy: true
          - image: r-diffab
            dockerfile: containers/r-diffab/Dockerfile
            context: .
            heavy: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        if: ${{ !matrix.heavy || github.event.inputs.build-heavy-containers == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: microsuite/${{ matrix.image }}:ci
          push: false
          load: ${{ !matrix.heavy }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Smoke test microsuite image
        if: ${{ matrix.image == 'microsuite' }}
        run: docker run --rm microsuite/${{ matrix.image }}:ci --help

      - name: Smoke test FastQC image
        if: ${{ matrix.image == 'fastqc' }}
        run: docker run --rm microsuite/${{ matrix.image }}:ci --version

      - name: Set up Python for FastQC integration test
        if: ${{ matrix.image == 'fastqc' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv for FastQC integration test
        if: ${{ matrix.image == 'fastqc' }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python test dependencies for FastQC integration test
        if: ${{ matrix.image == 'fastqc' }}
        run: uv sync --extra dev --locked

      - name: Run FastQC container integration test
        if: ${{ matrix.image == 'fastqc' }}
        env:
          MICROSUITE_RUN_DOCKER_TESTS: "1"
        run: uv run pytest tests/test_container_skeletons.py::test_fastqc_container_runs_tiny_fastq_end_to_end

      - name: Smoke test kraken2 image
        if: ${{ matrix.image == 'kraken2' }}
        run: docker run --rm --entrypoint kraken2 microsuite/${{ matrix.image }}:ci --version

      - name: Skip heavy container image
        if: ${{ matrix.heavy && github.event.inputs.build-heavy-containers != 'true' }}
        run: echo "Skipping heavy container image ${{ matrix.image }}. Use workflow_dispatch with build-heavy-containers=true to build it."
