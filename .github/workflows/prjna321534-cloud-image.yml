name: PRJNA321534 Cloud Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/microsuite-prjna321534-alpha

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: containers/prjna321534-alpha/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=prjna321534-alpha
          cache-to: type=gha,mode=max,scope=prjna321534-alpha

      - name: Smoke test image
        run: |
          docker pull "${IMAGE_NAME}:${GITHUB_SHA}"
          docker run --rm --entrypoint bash "${IMAGE_NAME}:${GITHUB_SHA}" \
            -lc 'test -x /usr/local/bin/run_prjna321534 && test -x /usr/local/bin/run_prjna321534_microsuite && command -v fasterq-dump && command -v vsearch && esearch -version && microsuite --help >/dev/null && Rscript -e "stopifnot(requireNamespace(\"breakaway\", quietly = TRUE)); stopifnot(requireNamespace(\"iNEXT\", quietly = TRUE))"'
