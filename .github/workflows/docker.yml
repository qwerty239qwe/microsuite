name: Docker

on:
  push:
    branches: [main]
    paths:
      - "containers/**"
      - "src/microsuite/diversity/r/**"
      - ".github/workflows/docker.yml"
      - "tests/fixtures/**"
  pull_request:
    branches: [main]
    paths:
      - "containers/**"
      - "src/microsuite/diversity/r/**"
      - ".github/workflows/docker.yml"
      - "tests/fixtures/**"
  workflow_dispatch:
    inputs:
      build-heavy-containers:
        description: "Build heavy QIIME 2, R/DADA2, vegan, and differential-abundance images"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: microsuite
            dockerfile: containers/microsuite/Dockerfile
            context: .
            heavy: false
          - image: fastqc
            dockerfile: containers/fastqc/Dockerfile
            context: .
            heavy: false
          - image: multiqc
            dockerfile: containers/multiqc/Dockerfile
            context: .
            heavy: false
          - image: fastp
            dockerfile: containers/fastp/Dockerfile
            context: .
            heavy: false
          - image: cutadapt
            dockerfile: containers/cutadapt/Dockerfile
            context: .
            heavy: false
          - image: trimmomatic
            dockerfile: containers/trimmomatic/Dockerfile
            context: .
            heavy: false
          - image: trim-galore
            dockerfile: containers/trim-galore/Dockerfile
            context: .
            heavy: false
          - image: vsearch
            dockerfile: containers/vsearch/Dockerfile
            context: .
            heavy: false
          - image: usearch
            dockerfile: containers/usearch/Dockerfile
            context: .
            heavy: false
          - image: mafft-fasttree
            dockerfile: containers/mafft-fasttree/Dockerfile
            context: .
            heavy: false
          - image: kraken2
            dockerfile: containers/kraken2/Dockerfile
            context: .
            heavy: false
          - image: metaphlan
            dockerfile: containers/metaphlan/Dockerfile
            context: .
            heavy: true
          - image: qiime2-amplicon
            dockerfile: containers/qiime2-amplicon/Dockerfile
            context: .
            heavy: true
          - image: r-dada2
            dockerfile: containers/r-dada2/Dockerfile
            context: .
            heavy: true
          - image: r-diffab-ancombc
            dockerfile: containers/r-diffab-ancombc/Dockerfile
            context: .
            heavy: true
          - image: r-diffab-aldex2
            dockerfile: containers/r-diffab-aldex2/Dockerfile
            context: .
            heavy: true
          - image: r-diffab-maaslin2
            dockerfile: containers/r-diffab-maaslin2/Dockerfile
            context: .
            heavy: true
          - image: r-diffab-lefse
            dockerfile: containers/r-diffab-lefse/Dockerfile
            context: .
            heavy: true
          - image: r-ecology
            dockerfile: containers/r-ecology/Dockerfile
            context: .
            heavy: true
          - image: r-batch-mmuphin
            dockerfile: containers/r-batch-mmuphin/Dockerfile
            context: .
            heavy: true
          - image: r-batch-combatseq
            dockerfile: containers/r-batch-combatseq/Dockerfile
            context: .
            heavy: true
          - image: microsuite-picrust2
            dockerfile: containers/microsuite-picrust2/Dockerfile
            context: .
            heavy: true
          - image: microsuite-dada2
            dockerfile: containers/microsuite-dada2/Dockerfile
            context: .
            heavy: true
          - image: mothur
            dockerfile: containers/mothur/Dockerfile
            context: .
            heavy: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        if: ${{ !matrix.heavy || github.event.inputs.build-heavy-containers == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: microsuite/${{ matrix.image }}:ci
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Verify Nextflow process metrics support
        if: ${{ (!matrix.heavy || github.event.inputs.build-heavy-containers == 'true') && contains(fromJSON('["cutadapt", "fastp", "microsuite", "microsuite-dada2", "multiqc"]'), matrix.image) }}
        run: docker run --rm --entrypoint sh microsuite/${{ matrix.image }}:ci -c 'command -v ps'

      - name: Smoke test microsuite image
        if: ${{ matrix.image == 'microsuite' }}
        run: |
          docker run --rm microsuite/${{ matrix.image }}:ci --help
          docker run --rm --user 10001:10001 \
            --entrypoint /opt/microsuite/.venv/bin/microsuite \
            microsuite/${{ matrix.image }}:ci --help

      - name: Run FastQC tiny example
        if: ${{ matrix.image == 'fastqc' }}
        run: |
          mkdir -p tmp/docker-fastqc
          docker run --rm \
            -v "${PWD}/tests/fixtures/fastq:/input:ro" \
            -v "${PWD}/tmp/docker-fastqc:/output" \
            microsuite/${{ matrix.image }}:ci \
            --outdir /output /input/tiny.fastq
          test -s tmp/docker-fastqc/tiny_fastqc.html
          test -s tmp/docker-fastqc/tiny_fastqc.zip

      - name: Run MultiQC tiny example
        if: ${{ matrix.image == 'multiqc' }}
        run: |
          mkdir -p tmp/docker-multiqc/input/tiny_fastqc tmp/docker-multiqc/output
          cat > tmp/docker-multiqc/input/tiny_fastqc/fastqc_data.txt <<'EOF'
          ##FastQC	0.12.1
          >>Basic Statistics	pass
          #Measure	Value
          Filename	tiny.fastq
          File type	Conventional base calls
          Encoding	Sanger / Illumina 1.9
          Total Sequences	1
          Sequences flagged as poor quality	0
          Sequence length	12
          %GC	50
          >>END_MODULE
          EOF
          docker run --rm \
            -v "${PWD}/tmp/docker-multiqc/input:/input:ro" \
            -v "${PWD}/tmp/docker-multiqc/output:/output" \
            microsuite/${{ matrix.image }}:ci \
            /input --outdir /output --force
          test -s tmp/docker-multiqc/output/multiqc_report.html

      - name: Run fastp tiny example
        if: ${{ matrix.image == 'fastp' }}
        run: |
          mkdir -p tmp/docker-fastp
          docker run --rm \
            -v "${PWD}/tests/fixtures/fastq:/input:ro" \
            -v "${PWD}/tmp/docker-fastp:/output" \
            microsuite/${{ matrix.image }}:ci \
            -i /input/tiny.fastq \
            -o /output/tiny.fastq \
            --html /output/fastp.html \
            --json /output/fastp.json
          test -s tmp/docker-fastp/tiny.fastq
          test -s tmp/docker-fastp/fastp.html
          test -s tmp/docker-fastp/fastp.json

      - name: Run Cutadapt tiny example
        if: ${{ matrix.image == 'cutadapt' }}
        run: |
          mkdir -p tmp/docker-cutadapt
          docker run --rm \
            -v "${PWD}/tests/fixtures/fastq:/input:ro" \
            -v "${PWD}/tmp/docker-cutadapt:/output" \
            microsuite/${{ matrix.image }}:ci \
            -a ACGT -o /output/tiny.fastq /input/tiny.fastq
          test -s tmp/docker-cutadapt/tiny.fastq

      - name: Run Trimmomatic tiny example
        if: ${{ matrix.image == 'trimmomatic' }}
        run: |
          mkdir -p tmp/docker-trimmomatic
          docker run --rm \
            -v "${PWD}/tests/fixtures/fastq:/input:ro" \
            -v "${PWD}/tmp/docker-trimmomatic:/output" \
            microsuite/${{ matrix.image }}:ci \
            SE -phred33 -threads 1 /input/tiny.fastq /output/tiny.fastq MINLEN:1
          test -s tmp/docker-trimmomatic/tiny.fastq

      - name: Run Trim Galore tiny example
        if: ${{ matrix.image == 'trim-galore' }}
        run: |
          mkdir -p tmp/docker-trim-galore
          docker run --rm \
            -v "${PWD}/tests/fixtures/fastq:/input:ro" \
            -v "${PWD}/tmp/docker-trim-galore:/output" \
            microsuite/${{ matrix.image }}:ci \
            --output_dir /output /input/tiny.fastq
          test -s tmp/docker-trim-galore/tiny_trimmed.fq

      - name: Run USEARCH tiny example
        if: ${{ matrix.image == 'usearch' }}
        run: |
          mkdir -p tmp/docker-usearch/input tmp/docker-usearch/output
          cat > tmp/docker-usearch/input/tiny.fasta <<'EOF'
          >seq1
          ACGTACGTACGTACGT
          >seq2
          ACGTACGTACGTACGA
          >seq3
          TTTTACGTACGTACGT
          EOF
          docker run --rm \
            -v "${PWD}/tmp/docker-usearch/input:/input:ro" \
            -v "${PWD}/tmp/docker-usearch/output:/output" \
            microsuite/${{ matrix.image }}:ci \
            -cluster_fast /input/tiny.fasta \
            -id 0.9 \
            -centroids /output/centroids.fasta \
            -uc /output/clusters.uc
          test -s tmp/docker-usearch/output/centroids.fasta
          test -s tmp/docker-usearch/output/clusters.uc

      - name: Run VSEARCH tiny example
        if: ${{ matrix.image == 'vsearch' }}
        run: |
          mkdir -p tmp/docker-vsearch/input tmp/docker-vsearch/output
          cat > tmp/docker-vsearch/input/tiny.fasta <<'EOF'
          >seq1
          ACGTACGTACGTACGTACGTACGTACGTACGTACGTACGT
          >seq2
          ACGTACGTACGTACGTACGTACGTACGTACGTACGTACGA
          >seq3
          TTTTACGTACGTACGTACGTACGTACGTACGTACGTACGT
          EOF
          docker run --rm \
            -v "${PWD}/tmp/docker-vsearch/input:/input:ro" \
            -v "${PWD}/tmp/docker-vsearch/output:/output" \
            microsuite/${{ matrix.image }}:ci \
            --cluster_fast /input/tiny.fasta \
            --id 0.9 \
            --minseqlength 1 \
            --centroids /output/centroids.fasta \
            --uc /output/clusters.uc
          test -s tmp/docker-vsearch/output/centroids.fasta
          test -s tmp/docker-vsearch/output/clusters.uc

      - name: Smoke test kraken2 image
        if: ${{ matrix.image == 'kraken2' }}
        run: |
          docker run --rm --entrypoint kraken2 microsuite/${{ matrix.image }}:ci --version
          docker run --rm --entrypoint bracken microsuite/${{ matrix.image }}:ci -h

      - name: Smoke test MAFFT/FastTree image
        if: ${{ matrix.image == 'mafft-fasttree' }}
        run: |
          docker run --rm --entrypoint bash microsuite/${{ matrix.image }}:ci \
            -lc 'command -v mafft && command -v FastTree'

      - name: Smoke test MetaPhlAn image
        if: ${{ matrix.image == 'metaphlan' && github.event.inputs.build-heavy-containers == 'true' }}
        run: docker run --rm microsuite/${{ matrix.image }}:ci --version

      - name: Smoke test microsuite-dada2 image
        if: ${{ matrix.image == 'microsuite-dada2' && github.event.inputs.build-heavy-containers == 'true' }}
        run: |
          set -euo pipefail
          # Wiring: prove both halves live in one image (this is what the split
          # microsuite / r-dada2 images cannot do on their own).
          docker run --rm --entrypoint Rscript microsuite/${{ matrix.image }}:ci -e 'library(dada2)'
          docker run --rm microsuite/${{ matrix.image }}:ci denoise --help >/dev/null
          docker run --rm --user 10001:10001 \
            --entrypoint /opt/microsuite/.venv/bin/microsuite \
            microsuite/${{ matrix.image }}:ci denoise --help >/dev/null
          # Generate a DADA2-learnable FASTQ: enough reads with position-dependent,
          # jittered quality (several Phred bins) and quality-correlated substitution
          # errors, so learnErrors can actually fit an error model. Uniform-quality
          # or too-clean reads make learnErrors return a NULL error matrix.
          mkdir -p tmp/docker-dada2/input tmp/docker-dada2/out
          python3 - <<'PY'
          import random
          rng = random.Random(7)
          bases = "ACGT"
          templates = ["".join(rng.choice(bases) for _ in range(150)) for _ in range(3)]
          reads = []
          for i in range(5000):
              tpl = rng.choice(templates)
              seq, qual = [], []
              for pos, base in enumerate(tpl):
                  q = max(20, min(40, int(38 - pos * 0.13) + rng.randint(-3, 3)))
                  if rng.random() < 10 ** (-q / 10.0):
                      base = rng.choice([b for b in bases if b != base])
                  seq.append(base)
                  qual.append(chr(q + 33))
              reads.append(f"@r{i + 1}\n{''.join(seq)}\n+\n{''.join(qual)}")
          with open("tmp/docker-dada2/input/sample1.fastq", "w") as fh:
              fh.write("\n".join(reads) + "\n")
          PY
          # Functional: DADA2 filterAndTrim + ASV inference, end-to-end via the CLI.
          docker run --rm \
            -v "${PWD}/tmp/docker-dada2/input:/input:ro" \
            -v "${PWD}/tmp/docker-dada2/out:/output" \
            microsuite/${{ matrix.image }}:ci \
            denoise --backend dada2-r \
            --demux /input \
            --output-table /output/table.tsv \
            --output-rep-seqs /output/rep-seqs.fasta \
            --output-stats /output/stats.tsv \
            --trunc-len 0 --max-ee 2 --threads 2
          test -s tmp/docker-dada2/out/table.tsv
          test -s tmp/docker-dada2/out/rep-seqs.fasta
          test -s tmp/docker-dada2/out/stats.tsv
          grep -q '^>ASV1' tmp/docker-dada2/out/rep-seqs.fasta

      - name: Smoke test vegan ecology image
        if: ${{ matrix.image == 'r-ecology' && github.event.inputs.build-heavy-containers == 'true' }}
        run: |
          mkdir -p tmp/docker-r-ecology
          docker run --rm \
            -v "${PWD}/containers/r-ecology/smoke:/input:ro" \
            -v "${PWD}/tmp/docker-r-ecology:/output" \
            microsuite/${{ matrix.image }}:ci \
            /opt/microsuite/beta_significance.R \
            /input/distance.tsv /input/metadata.tsv adonis2 group "" 19 0 /output/adonis2.tsv
          docker run --rm \
            -v "${PWD}/containers/r-ecology/smoke:/input:ro" \
            -v "${PWD}/tmp/docker-r-ecology:/output" \
            microsuite/${{ matrix.image }}:ci \
            /opt/microsuite/beta_significance.R \
            /input/distance.tsv /input/metadata.tsv anosim2 group "" 19 0 /output/anosim2.tsv
          test -s tmp/docker-r-ecology/adonis2.tsv
          test -s tmp/docker-r-ecology/anosim2.tsv

      # Publish images that were built and passed their smoke test. Only on the
      # main branch (never PRs), and only for images actually built this run.
      - name: Log in to GitHub Container Registry
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (!matrix.heavy || github.event.inputs.build-heavy-containers == 'true') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (!matrix.heavy || github.event.inputs.build-heavy-containers == 'true') }}
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          src="microsuite/${{ matrix.image }}:ci"
          dest="ghcr.io/${owner}/microsuite/${{ matrix.image }}"
          sha="sha-$(git rev-parse --short HEAD)"
          docker tag "$src" "$dest:$sha"
          docker tag "$src" "$dest:latest"
          docker push "$dest:$sha"
          docker push "$dest:latest"
          echo "Published $dest:$sha and $dest:latest"

      - name: Skip heavy container image
        if: ${{ matrix.heavy && github.event.inputs.build-heavy-containers != 'true' }}
        run: echo "Skipping heavy container image ${{ matrix.image }}. Use workflow_dispatch with build-heavy-containers=true to build it."
