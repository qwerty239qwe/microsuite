[project]
name = "microsuite"
version = "0.2.1"
description = "Unified CLI and Python tools for microbiome feature-table analysis."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "microsuite contributors" }]
dependencies = [
    "anndata>=0.10",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "platformdirs>=4.0",
    "rich>=13.7",
    "scipy>=1.11",
    "typer>=0.12",
]

[project.optional-dependencies]
# BIOM tables and QIIME 2 .qza feature tables both decode through biom-format
# (io/qza.py reads the embedded BIOM table via io/biom.py).
biom = ["biom-format>=2.1"]
qza = ["biom-format>=2.1"]
# R differential-abundance/network backends are external runtimes supplied by the
# user, not Python packages, so this extra intentionally adds no Python deps.
r = []
# Reference-database fetching (HOMD/SILVA/GTDB/GreenGenes/UNITE/PR2) via biodbs.
# biodbs is not yet published to PyPI at 0.4.0; until then, install it from the
# git tag directly (see docs/superpowers/specs/biodbs-v040-probe.md):
#   uv pip install "git+https://github.com/qwerty239qwe/biodbs.git@biodbs_v0.4.0"
refdb = ["biodbs>=0.4.0"]
all = ["microsuite[biom,qza,r,refdb]"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "ty>=0.0.1a6",
    # Validates the published stage-result JSON Schema + fixtures in tests; the
    # runtime validator stays dependency-free (test_metadata_schema_contract.py
    # skips the JSON-Schema parity checks when jsonschema is absent).
    "jsonschema>=4.20",
]

[project.scripts]
microsuite = "microsuite.cli.app:main"
microbiome = "microsuite.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".uv-cache", ".venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.src]
# Type-check shipping code. Tests are runtime-validated by pytest; checking them
# adds mostly pandas/anndata stub false positives (e.g. DataFrame(index=list[str]))
# with little signal.
include = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["microsuite"]
branch = true

[tool.coverage.report]
show_missing = true
