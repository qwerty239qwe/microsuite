[project]
name = "microsuite"
version = "0.1.0"
description = "Unified CLI and Python tools for microbiome feature-table analysis."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "microsuite contributors" }]
dependencies = [
    "anndata>=0.10",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "platformdirs>=4.0",
    "rich>=13.7",
    "scipy>=1.11",
    "typer>=0.12",
]

[project.optional-dependencies]
biom = ["biom-format>=2.1"]
qza = ["biom-format>=2.1"]
r = []
all = ["biom-format>=2.1"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "ty>=0.0.1a6",
]

[project.scripts]
microsuite = "microsuite.cli.app:main"
microbiome = "microsuite.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".uv-cache", ".venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.src]
include = ["src", "tests"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
